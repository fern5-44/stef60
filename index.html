<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Stef60 – Anmeldung</title>

  <link rel="stylesheet" href="style.css" />

</head>


<body>

  <main>

    <!-- =====================================================
         KOPF
         ===================================================== -->

    <h1 id="title"></h1>

    <p id="meta"></p>

    <p
      id="progress"
      aria-live="polite">
    </p>

    <p
      id="status"
      role="status">
    </p>


    <!-- =====================================================
         FORMULAR
         ===================================================== -->

    <form
      id="rsvp"
      novalidate>


      <!-- ===================================================
           SCHRITT 0 – SICHERHEITSFRAGEN
           =================================================== -->

      <fieldset data-step="0">

        <legend>
          Ich bin kein Roboter.
        </legend>


        <p>
          Beantworte alle drei Fragen richtig,
          um weiterzukommen.
        </p>


        <!-- Frage 1 -----------------------------------------
             PLATZHALTER: Frage, Tipp und Antworten hier eintragen.
             Die richtige Antwort (a, b, c oder d) steht in app.js
             bei SECURITY_ANSWERS.
             --------------------------------------------------- -->

        <fieldset class="question">

          <legend>
            <button
              type="button"
              class="tipp-btn"
              data-tipp="tipp1"
              aria-label="Tipp anzeigen"
              aria-expanded="false"
              aria-controls="tipp1">💡</button>Frage 1: Wie alt werde ich?</legend>

          <div class="tipp-box" id="tipp1" hidden>
            <p>Fang rechts an zu zählen.</p>
            <button
              type="button"
              class="tipp-close"
              data-tipp-close="tipp1"
              aria-label="Tipp schliessen">✕</button>
          </div>

          <label>
            <input type="radio" name="question1" value="a" />
            111111
          </label>

          <label>
            <input type="radio" name="question1" value="b" />
            111000
          </label>

          <label>
            <input type="radio" name="question1" value="c" />
            111101
          </label>

          <label>
            <input type="radio" name="question1" value="d" />
            111100
          </label>

        </fieldset>


        <!-- Frage 2 -----------------------------------------
             PLATZHALTER: Frage, Tipp und Antworten hier eintragen.
             Die richtige Antwort (a, b, c oder d) steht in app.js
             bei SECURITY_ANSWERS.
             --------------------------------------------------- -->

        <fieldset class="question">

          <legend>
            <button
              type="button"
              class="tipp-btn"
              data-tipp="tipp2"
              aria-label="Tipp anzeigen"
              aria-expanded="false"
              aria-controls="tipp2">💡</button>Frage 2: Mein Name auf Chinesisch</legend>

          <div class="tipp-box" id="tipp2" hidden>
            <p>Muss man wissen!!!</p>
            <button
              type="button"
              class="tipp-close"
              data-tipp-close="tipp2"
              aria-label="Tipp schliessen">✕</button>
          </div>

          <label>
            <input type="radio" name="question2" value="a" />
            Chanjing
          </label>

          <label>
            <input type="radio" name="question2" value="b" />
            Schüdifu
          </label>

          <label>
            <input type="radio" name="question2" value="c" />
            Xingchom
          </label>

          <label>
            <input type="radio" name="question2" value="d" />
            Schmafun
          </label>

        </fieldset>


        <!-- Frage 3 -----------------------------------------
             PLATZHALTER: Frage, Tipp und Antworten hier eintragen.
             Die richtige Antwort (a, b, c oder d) steht in app.js
             bei SECURITY_ANSWERS.
             --------------------------------------------------- -->

        <fieldset class="question">

          <legend>
            <button
              type="button"
              class="tipp-btn"
              data-tipp="tipp3"
              aria-label="Tipp anzeigen"
              aria-expanded="false"
              aria-controls="tipp3">💡</button>Frage 3: Meine Lieblingsschoki</legend>

          <div class="tipp-box" id="tipp3" hidden>
            <p>Süss</p>
            <button
              type="button"
              class="tipp-close"
              data-tipp-close="tipp3"
              aria-label="Tipp schliessen">✕</button>
          </div>

          <label>
            <input type="radio" name="question3" value="a" />
            Braune Lindttafel
          </label>

          <label>
            <input type="radio" name="question3" value="b" />
            Weisse Schokolade
          </label>

          <label>
            <input type="radio" name="question3" value="c" />
            Kirschtafel
          </label>

          <label>
            <input type="radio" name="question3" value="d" />
            Möglichst dunkel
          </label>

        </fieldset>


        <!-- Weiter ------------------------------------------ -->

        <p class="nav">

          <button
            type="button"
            data-next>
            Weiter
          </button>

        </p>

      </fieldset>


      <!-- ===================================================
           SCHRITT 1 – ANMELDUNG
           =================================================== -->

      <fieldset
        data-step="1"
        hidden>

        <legend>
          Deine Angaben
        </legend>


        <p>

          <label for="anzahl">
            Wie viele Personen meldest du an?
          </label>

          <!-- Optionen werden in app.js erzeugt (MAX_PERSONEN) -->
          <select
            id="anzahl"
            name="anzahl">
          </select>

        </p>


        <!-- Hier erscheinen pro Person ein Vorname- und ein Nachname-Feld -->
        <div id="personen"></div>


        <p class="nav">

          <button
            type="button"
            data-back>
            Zurück
          </button>


          <button
            type="button"
            data-next>
            Weiter
          </button>

        </p>

      </fieldset>


      <!-- ===================================================
           SCHRITT 2 – BEMERKUNGEN
           =================================================== -->

      <fieldset
        data-step="2"
        hidden>

        <legend>
          Noch etwas?
        </legend>


        <p>

          <label for="remarks">

            Bemerkungen

            <span
              class="opt">
              (optional)
            </span>

          </label>


          <textarea
            id="remarks"
            name="remarks"
            rows="5"
            maxlength="400"></textarea>

        </p>


        <p class="nav">

          <button
            type="button"
            data-back>
            Zurück
          </button>


          <button
            type="submit">
            Anmeldung abschicken
          </button>

        </p>

      </fieldset>


      <!-- ===================================================
           FEHLER
           =================================================== -->

      <p
        id="error"
        role="alert">
      </p>


    </form>


    <!-- =====================================================
         NACH DEM ABSENDEN
         ===================================================== -->

    <section
      id="step-done"
      hidden>


      <h2 id="done-title">
        Angemeldet
      </h2>


      <!-- Übersicht: Bild wird in app.js geladen (UEBERSICHT_DATEI).
           Fehlt die Datei noch, wird dieser Bereich ausgeblendet. -->
      <canvas
        id="ticket"
        width="1080"
        height="1350"
        role="img"
        aria-label="Übersicht zum Fest">
      </canvas>


      <p class="actions">

        <button
          type="button"
          id="download">
          Übersicht herunterladen
        </button>


        <!-- Termin für alle gleich – Datei: siehe TERMIN_DATEI in app.js -->
         <a
          class="btn"
          target="_blank"
          rel="noopener"
          href="https://raw.githubusercontent.com/fern5-44/stef60/refs/heads/main/termine.ics"
          download>
          Termin in Kalender eintragen
        </a>


       
      </p>

    </section>


  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="app.js"></script>

  <!-- Tipp auf-/zuklappen -->
  <script>
    document.addEventListener("click", function (e) {
      var open = e.target.closest("[data-tipp]");
      var close = e.target.closest("[data-tipp-close]");

      if (open) {
        var box = document.getElementById(open.dataset.tipp);
        var show = box.hidden;
        box.hidden = !show;
        open.setAttribute("aria-expanded", show ? "true" : "false");
      }

      if (close) {
        var box2 = document.getElementById(close.dataset.tippClose);
        var btn = document.querySelector('[data-tipp="' + close.dataset.tippClose + '"]');
        box2.hidden = true;
        btn.setAttribute("aria-expanded", "false");
        btn.focus();
      }
    });
  </script>

</body>

</html>
